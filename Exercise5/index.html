<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Building a tabulated box</title>
    <script src="script.js" defer></script>
</head>
<body>
<link rel="stylesheet" href="style.css" />
<div class="tabs">
    <div class="tabs__sidebar">
        <button class="tabs__button tabs__button--active" data-for-tab="1">tab #1</button>
        <button class="tabs__button tabs__button--active" data-for-tab="2">tab #2</button>
        <button class="tabs__button tabs__button--active" data-for-tab="3">tab #3</button>
    </div>

    <div class="tabs__content tabs__content--active" data-tab="1">content1</div>
    <div class="tabs__content tabs__content--active" data-tab="2">content2</div>
    <div class="tabs__content tabs__content--active" data-tab="3">content3</div>

</div>
</body>
</html>
